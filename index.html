<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Speaking Test </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4a69bd;
      --primary-dark: #1e3799;
      --secondary: #fa983a;
      --secondary-dark: #e55039;
      --accent: #78e08f;
      --accent-dark: #38ada9;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-main: #2f3640;
      --text-light: #718093;
      --font-header: 'Poppins', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      background-color: var(--bg-color);
      background-image: radial-gradient(#dcdde1 2px, transparent 2px);
      background-size: 30px 30px;
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .level-controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .level-tab {
      background: #ced6e0;
      color: #2f3640;
      font-family: var(--font-header);
      font-size: 1.2rem;
      font-weight: 800;
      padding: 10px 25px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow: 0 4px 0 #a4b0be;
    }

    .level-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .header { text-align: center; margin-bottom: 10px; }

    .level-badge {
      display: inline-block;
      background: var(--secondary);
      color: white;
      font-family: var(--font-header);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-shadow: 0 4px 0 var(--secondary-dark);
    }

    h1 {
      font-family: var(--font-header);
      font-size: 3.5rem;
      margin: 0;
      color: var(--primary);
      text-transform: uppercase;
      text-shadow: 3px 3px 0px rgba(74, 105, 189, 0.2);
    }

    .grid-container {
      background: var(--card-bg);
      border: 5px solid var(--primary);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .box-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
    }

    .number-box {
      background: var(--secondary);
      color: white;
      font-family: var(--font-header);
      font-size: 1.8rem;
      font-weight: 800;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 65px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--secondary-dark);
      transition: all 0.15s ease;
      user-select: none;
    }

    .number-box.picked {
      background: #bdc3c7;
      color: #ecf0f1;
      box-shadow: 0 0 0 transparent;
      transform: translateY(6px);
      cursor: not-allowed;
    }

    .result-area {
      background: var(--card-bg);
      border: none;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .hidden { display: none !important; }

    .phase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 4px solid #f1f2f6;
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .phase-title {
      font-family: var(--font-header);
      color: var(--primary-dark);
      font-size: 2rem;
      text-transform: uppercase;
      margin: 0;
    }

    .phase-indicator {
      background: var(--accent-dark);
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      background: #f0f4ff;
      padding: 20px;
      border-radius: 15px;
      justify-content: center;
      border: 2px dashed var(--primary);
      min-height: 80px; 
    }

    .word-badge {
      background: white;
      color: var(--primary-dark);
      font-size: 1.4rem;
      font-family: var(--font-header);
      padding: 8px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      border: 2px solid var(--primary);
      cursor: grab;
      user-select: none;
      transition: transform 0.1s;
    }

    .word-badge:active {
      cursor: grabbing;
    }

    .word-badge.dragging {
      opacity: 0.5;
      transform: scale(0.95);
    }

    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sentence-item {
      font-size: 1.5rem;
      line-height: 1.6;
      padding-left: 20px;
      border-left: 5px solid var(--secondary);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .sentence-item strong {
      margin-right: 10px;
    }

    .drop-zone {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 140px;
      height: 45px;
      border-bottom: 3px solid var(--primary);
      margin: 0 10px;
      background-color: #f4f6f8;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .drop-zone.over {
      background-color: rgba(120, 224, 143, 0.2);
      border-color: var(--accent);
      transform: scale(1.05);
    }

    .drop-zone .word-badge {
      margin: 0;
      font-size: 1.2rem;
      padding: 4px 15px;
      box-shadow: none;
    }

    .reading-passage {
      background: #fff9c4;
      padding: 30px;
      border-radius: 15px;
      font-size: 1.6rem;
      line-height: 1.8;
      color: #2c3e50;
      border-left: 8px solid #f1c40f;
    }

    .formula-box, .guidelines, .answer-box { margin-top: 25px; }
    .formula-box { background-color: #f0f4ff; border-left: 6px solid var(--primary); padding: 25px; border-radius: 0 16px 16px 0; }
    .formula-text { font-size: 1.6rem; line-height: 1.6; }
    .formula-text strong { background: rgba(74, 105, 189, 0.1); padding: 2px 8px; border-radius: 4px; border: 1px dashed var(--primary); }
    .guidelines li { margin-bottom: 20px; padding-left: 45px; position: relative; color: var(--primary-dark); font-size: 1.6rem; font-weight: 700; }
    .guidelines li::before { content: "👉"; position: absolute; left: 0; font-size: 1.8rem; top: -2px; }
    
    .btn-group {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    
    .btn-group button {
      flex: 1;
      margin-top: 0;
    }

    .answer-btn, .nav-btn, .spin-btn {
      font-size: 1.5rem;
      padding: 15px 30px;
      font-family: var(--font-header);
      font-weight: 800;
      border-radius: 16px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      width: 100%;
    }

    .answer-btn {
      background: var(--accent);
      box-shadow: 0 6px 0 var(--accent-dark);
      color: #1e3799;
    }
    .answer-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 var(--accent-dark); }
    
    .spin-btn {
      background: var(--secondary);
      box-shadow: 0 6px 0 var(--secondary-dark);
      color: white;
    }
    .spin-btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 var(--secondary-dark); }

    .nav-btn { background: var(--primary); color: white; box-shadow: 0 6px 0 var(--primary-dark); margin-top: 20px; }
    .nav-btn:hover { background: var(--primary-dark); box-shadow: 0 4px 0 #0c2461; }

    .answer-box {
      padding: 35px 30px; background: #fff9c4; border-left: 8px solid #f1c40f; 
      font-size: 1.6rem; font-weight: 500; border-radius: 0 16px 16px 0; position: relative;
    }
    .answer-box::before { content: "SAMPLE ANSWER"; position: absolute; top: -16px; left: 20px; background: #f1c40f; font-family: var(--font-header); font-size: 1.1rem; padding: 6px 16px; border-radius: 20px; font-weight: 800; }
  </style>
</head>

        <h2 style="font-family: var(--font-header); font-size: 2rem; margin-top: 10px;" id="scenario-situation">Situation</h2>
        
        <div class="formula-box hidden" id="formula-container">

        </div>
        
        <div class="guidelines hidden" id="guidelines-container">
          <h3 style="color:var(--text-light); font-family:var(--font-header);">Guidelines</h3>
          <ul id="guidelines-list"></ul>
        </div>

        <div class="btn-group">
          <button class="spin-btn" id="spin-btn">🎲 SPIN AGAIN</button>
          <button class="answer-btn" id="answer-btn">SHOW SAMPLE ANSWER</button>
        </div>
        
        <div class="answer-box hidden" id="answer-box"></div>
      </div>

      <button class="nav-btn" id="next-phase-btn">NEXT PHASE</button>
    </div>
  </div>

            { situation: "Do you prefer traveling solo or with a group? Why?", guidelines: ["State your preference clearly.", "Give a reason related to freedom or safety.", "Mention a downside to the opposite choice."], answer: "I prefer traveling with a group of close friends. It's much safer, and we can share the costs of food and taxis. Traveling solo sounds very free, but I think I would get lonely having no one to share the memories with." },

            { situation: "What are the pros and cons of teenagers using social media?", guidelines: ["Mention one clear benefit (pro).", "Mention one clear negative effect (con).", "Give a concluding thought on balance."], answer: "A major pro of social media is that teenagers can easily make friends and join communities with similar interests. However, a big con is cyberbullying and comparing themselves to unrealistic photos online. I think it's okay to use, but screen time needs to be balanced." },

            { situation: "Explain a traditional custom from your country.", guidelines: ["Name the custom or action.", "Explain the meaning behind it.", "Say when or where it usually happens."], answer: "In Taiwan, a common custom is giving red envelopes during the Lunar New Year. Adults give them to children, and the money inside represents good luck and blessings for the coming year. It's always a very happy moment for the kids!" },
            { situation: "Compare a cultural norm in your country to one in Western countries.", guidelines: ["Identify the specific cultural difference.", "Describe how it works in your country.", "Contrast it with the Western approach."], answer: "A big cultural difference is taking off shoes indoors. In Taiwan, it is extremely rude to wear outdoor shoes inside someone's home, so we always switch to slippers. In many Western countries, people often leave their shoes on when walking around the house." },
            { situation: "Describe a national holiday and how people celebrate it.", guidelines: ["Name the holiday and the time of year it occurs.", "Describe the special food eaten.", "Mention a specific activity people do."], answer: "The Dragon Boat Festival happens in early summer. People celebrate by eating Zongzi, which are sticky rice dumplings wrapped in bamboo leaves. Many cities also hold exciting boat races on the river, where teams paddle to the beat of a loud drum." },
            { situation: "How important is traditional food to your culture?", guidelines: ["State your opinion on its importance.", "Give an example of a traditional dish.", "Explain how food brings people together."], answer: "Traditional food is incredibly important to our culture. Dishes like beef noodle soup or hot pot are more than just meals; they are ways to connect. When families gather around a big hot pot on a cold winter night, it creates a feeling of warmth and unity." }

            { situation: "Do you prefer reading the book or watching the movie adaptation?", guidelines: ["State your preference.", "Give a reason related to imagination or visual experience.", "Acknowledge the benefits of the other medium."], answer: "I almost always prefer reading the book first. Books let me use my own imagination to picture the characters, and they usually contain much more detail. However, movies are great when you want to relax and enjoy amazing visual effects." },
            { situation: "Describe your taste in music and how it affects your mood.", guidelines: ["Name your favorite music genre or artist.", "Explain when you usually listen to it.", "Describe how the music makes you feel."], answer: "My favorite genre is upbeat pop music. I usually listen to it in the morning when I am getting ready for school or exercising. It gives me a lot of energy and immediately puts me in a positive, happy mood for the rest of the day." },
            { situation: "Have you ever been to a live concert? Describe the experience.", guidelines: ["Mention who you saw and where.", "Describe the atmosphere (crowd, noise, lights).", "Explain what you enjoyed most about it."], answer: "Yes, I went to a Coldplay concert last year in a huge stadium. The atmosphere was incredible—thousands of people were singing along, and everyone had glowing wristbands that changed color to the beat. Hearing the songs live felt so much more powerful than listening on my phone." }

            { situation: "What personal habits do you have to help the environment?", guidelines: ["Mention a specific daily action you take.", "Explain how this action reduces waste or saves energy.", "State why you think it's important."], answer: "I always bring my own reusable cup when I buy drinks, and I carry a cloth shopping bag. This reduces the amount of single-use plastic that ends up in the ocean. It's a small habit, but if everyone does it, it can make a huge difference." },
            { situation: "Do you think climate change is getting worse? Why?", guidelines: ["State your opinion clearly.", "Give an example of changing weather patterns you have noticed.", "Express a hope or concern for the future."], answer: "Yes, I believe climate change is getting much worse. The summers in Taiwan are becoming hotter and longer every year, and the rain storms are much more sudden and violent. I am worried about what the planet will look like in 50 years if we don't act now." },
            { situation: "Would you ever volunteer to clean up a beach or park?", guidelines: ["Say yes or no.", "Explain your reasoning.", "Describe what the experience might be like."], answer: "Yes, I would definitely volunteer for a beach cleanup. I think it is our responsibility to take care of nature. Picking up trash in the hot sun sounds tiring, but it would feel very rewarding to see a clean beach at the end of the day." }

            { situation: "What are the pros and cons of working remotely (from home)?", guidelines: ["Give one major advantage (pro).", "Give one major disadvantage (con).", "State whether you would prefer to work remotely or in an office."], answer: "The biggest pro of working from home is saving time and money on commuting. However, the con is that it can be lonely, and it's hard to separate your work life from your home life. Personally, I would prefer a hybrid schedule, going to the office a few days a week." },
            { situation: "Do you think getting good grades is the only way to be successful?", guidelines: ["State your opinion directly.", "Provide an example of a skill that grades don't measure.", "Redefine what success means to you in this context."], answer: "No, I don't think good grades are the only way to be successful. Grades don't measure creativity, leadership, or how well you work with other people. Real success comes from finding something you are passionate about and working hard at it, even if you aren't the top student." },
            { situation: "If you could do any job in the world, what would it be?", guidelines: ["Name a dream job (realistic or fantasy).", "Explain what the daily tasks would be.", "Describe why it would make you happy."], answer: "If I could do anything, I would be a travel photographer for a magazine like National Geographic. My daily job would be exploring new countries and taking pictures of wildlife and cultures. It would make me so happy because I love art and experiencing new things." }

            { situation: "How do you usually get your daily news?", guidelines: ["Mention the platform or medium (e.g., social media, TV, newspaper).", "Explain why you prefer this method.", "Acknowledge a potential problem with your method (e.g., fake news)."], answer: "I usually get my news by reading short articles on social media platforms like X or Instagram. It's very fast and fits into my busy schedule. However, I know I have to be careful because fake news spreads very easily on social media." },
            { situation: "Why is it important to pay attention to global events?", guidelines: ["State a reason related to the economy or environment.", "Give an example of how a distant event affects you locally.", "Conclude with a thought on being a global citizen."], answer: "It's vital to pay attention to global events because the world is deeply connected. For example, a conflict or a natural disaster in another country can increase the price of oil or food right here in Taiwan. Staying informed helps us become responsible global citizens." },
            { situation: "Do you think the news focuses too much on negative stories?", guidelines: ["Give your opinion.", "Explain why you think the media does this.", "Suggest what you would like to see more of."], answer: "Yes, I feel like the news is 90% negative, focusing on accidents, wars, and politics. I think the media does this because shocking stories get more clicks and views. I really wish they would dedicate a section every day just to highlighting people helping each other." }

            { situation: "What are the differences between living in a big city versus a rural area?", guidelines: ["Mention an advantage of city living.", "Mention an advantage of rural living.", "State which environment you prefer to live in."], answer: "Big cities offer amazing public transportation, great hospitals, and diverse entertainment. On the other hand, rural areas have clean air, bigger houses, and a much more peaceful lifestyle. Right now, I prefer the exciting energy of the big city." },
            { situation: "How is your generation different from your parents' generation?", guidelines: ["Identify a major difference (e.g., technology, values).", "Provide an example of how your generation acts.", "Provide an example of how your parents' generation acts."], answer: "The biggest difference is how we use technology and communicate. My generation prefers texting, making short videos, and working flexible jobs. My parents' generation values face-to-face phone calls, stability, and staying at the same company for 20 years." },
            { situation: "What is an important social issue in your country right now?", guidelines: ["Identify the issue (e.g., aging population, housing prices).", "Explain why it is a problem.", "Suggest a way society could improve the situation."], answer: "A major issue in Taiwan is the incredibly high cost of housing compared to average salaries. It's a huge problem because young people feel they can never afford to buy a home or start a family. The government really needs to build more affordable social housing." },
            { situation: "Do you think healthcare should be free for everyone?", guidelines: ["State your opinion clearly.", "Give a reason related to human rights or equality.", "Acknowledge how it might be paid for (e.g., taxes)."], answer: "Yes, I believe basic healthcare is a human right and should be accessible to everyone, regardless of their wealth. No one should go bankrupt just because they get sick. Of course, this means we all have to pay slightly higher taxes to support the system, which I think is fair." }

            { situation: "How do you think Artificial Intelligence (AI) will change our lives in the next 10 years?", guidelines: ["Predict one major change in the workplace.", "Predict one change in daily home life.", "State if you feel positive or anxious about this."], answer: "In the workplace, I think AI will take over most repetitive tasks, forcing humans to focus on creative problem-solving. At home, smart assistants will likely cook and clean for us. I feel mostly positive, but a little anxious about people losing their jobs." },
            { situation: "Would you ever want to travel to space as a tourist?", guidelines: ["Say yes or no.", "Explain your reasoning (e.g., curiosity, fear).", "Mention what you would want to see up there."], answer: "I would absolutely love to travel to space. I think experiencing zero gravity and looking down at the Earth from orbit would be the most profound experience of my life. I'm not really scared; I think the science is advancing fast enough to be safe." },
            { situation: "What future technology do you wish existed right now?", guidelines: ["Name a fictional or developing technology.", "Explain what problem it would solve.", "Describe how you would use it daily."], answer: "I wish teleportation machines existed right now. It would completely solve the problem of traffic jams and the carbon emissions from airplanes. I would use it to travel to Paris for breakfast and be back in Taiwan for school by 8 a.m." },
            { situation: "Discuss an innovation that could help stop climate change.", guidelines: ["Name the innovation (e.g., lab-grown meat, better solar panels).", "Explain how it works briefly.", "Discuss its potential impact on the planet."], answer: "I think lab-grown meat is a massive innovation for the environment. It allows us to eat real meat without needing huge farms that cut down forests and produce methane gas. If it becomes cheap, it could drastically reduce our global carbon footprint." }
          ]

        { 
          name: "Art & Culture", 
          scenarios: [ 
            { situation: "What role does art (painting, music, cinema) play in society?", guidelines: ["State why art is important beyond just looking nice.", "Give an example of how art affects emotions or ideas.", "Conclude with your personal view on art."], answer: "Art plays a crucial role in society because it allows people to express complex emotions and challenge traditional ideas. For example, a powerful movie can change how people view a historical event. To me, a world without art and music would be incredibly depressing." },
            { situation: "Do you think modern art is harder to understand than classical art?", guidelines: ["Give your opinion.", "Describe a characteristic of classical art.", "Describe a characteristic of modern art."], answer: "Yes, I find modern art much harder to understand. Classical art usually depicts clear, recognizable things like people or landscapes, so you know exactly what you are looking at. Modern art often uses abstract shapes or weird concepts that require the artist to explain the meaning." },
            { situation: "How has streaming changed the music industry?", guidelines: ["Mention how people used to listen to music.", "Explain the current streaming model (Spotify, Apple Music).", "Discuss a positive or negative result for artists."], answer: "We used to buy physical CDs, which meant you only listened to a few artists. Now, streaming platforms give us access to millions of songs for a small monthly fee. This is great for listeners, but it can be negative for smaller artists who make very little money per stream." },
            { situation: "If you could learn any artistic skill perfectly, what would it be?", guidelines: ["Name the skill (e.g., playing violin, sculpting, directing).", "Explain why you admire this skill.", "Describe what you would create first."], answer: "If I could master any skill, it would be 3D digital animation. I really admire how animators can create entire living, breathing worlds from scratch. The first thing I would create is a short film about a futuristic cyberpunk city." }

          scenarios: [ 
            { situation: "How do you define 'success' in life?", guidelines: ["State what success means to you personally.", "Contrast your definition with a common societal view.", "Give an example of a successful person by your standards."], answer: "To me, success simply means being happy, healthy, and surrounded by people you love. Society often says success is having a million dollars and a luxury car. By my standards, my grandfather is highly successful because he lived a peaceful life and was loved by everyone in his community." },
            { situation: "Can money buy happiness? Explain your thoughts.", guidelines: ["State your stance (yes, no, or partially).", "Explain how money solves basic problems.", "Explain what money cannot buy."], answer: "I think money can buy happiness up to a certain point. Having enough money removes the stress of paying rent and buying food, which makes you much happier. However, once you are comfortable, billions of dollars cannot buy you true love or genuine health." },
            { situation: "If you had to choose between a high-paying, stressful job or a low-paying, relaxing job, which would you pick?", guidelines: ["State your choice clearly.", "Explain the main reason for your choice.", "Discuss how it would affect your lifestyle."], answer: "I would definitely choose the lower-paying, relaxing job. Mental health is much more important to me than buying expensive things. With a relaxing job, I would have the time and energy to pursue my hobbies, spend time with my family, and actually enjoy my weekends." },
            { situation: "Who is your biggest role model, and what have you learned from them?", guidelines: ["Name the person (famous or personal).", "Describe a specific quality you admire in them.", "Explain how you try to apply that quality in your life."], answer: "My biggest role model is my older sister. I admire her incredible resilience; whenever she fails at something, she never gives up and just tries a different approach. I try to apply this by not getting too frustrated when I do poorly on a difficult test, but rather studying harder for the next one." }
          ] 
        }
      ]
    };

    let currentLevel = 'basic';
    let currentPhase = 1;
    let draggedItem = null;
    const GRID_SIZE = 48;
    
    let currentVocabTest = {};
    let currentReadingText = "";
    let currentSpeakingTask = {};

    const boxGrid = document.getElementById('box-grid');
    const resultArea = document.getElementById('result-area');
    const nextPhaseBtn = document.getElementById('next-phase-btn');
    
    const phaseTitle = document.getElementById('phase-title');
    const phaseIndicator = document.getElementById('phase-indicator');
    const phase1Content = document.getElementById('phase-1-content');
    const phase2Content = document.getElementById('phase-2-content');
    const phase3Content = document.getElementById('phase-3-content');

    async function init() {
      await loadExternalVocabulary();
      
      document.getElementById('btn-basic').addEventListener('click', () => setLevel('basic'));
      document.getElementById('btn-inter').addEventListener('click', () => setLevel('intermediate'));
      nextPhaseBtn.addEventListener('click', handleNextPhase);
      
      document.getElementById('answer-btn').addEventListener('click', toggleAnswer);
      document.getElementById('spin-btn').addEventListener('click', handleSpinAgain);

      setLevel('basic');
    }

    async function loadExternalVocabulary() {
      try {
        const response = await fetch('vocab.md');
        if (!response.ok) throw new Error("File not found");
        const text = await response.text();
        
        const lines = text.split('\n');
        const parsedDB = [];
        let tempWord = "";
        
        lines.forEach(line => {
          if (line.includes("Word:")) {
            tempWord = line.split("Word:")[1].trim();
          } else if (line.includes("Sentence:") && tempWord !== "") {
            const sentence = line.split("Sentence:")[1].trim();
            parsedDB.push({ word: tempWord, sentence: sentence });
            tempWord = ""; 
          }
        });

        if (parsedDB.length >= 6) {
          vocabDB = parsedDB; 
        }
      } catch (error) {
        console.log("Could not fetch vocab.md, using internal fallback database.");
      }
    }

    function setLevel(level) {
      currentLevel = level;
      const btnBasic = document.getElementById('btn-basic');
      const btnInter = document.getElementById('btn-inter');
      const badgeDisplay = document.getElementById('badge-display');
      
      if (level === 'basic') {
        btnBasic.classList.add('active');
        btnInter.classList.remove('active');
        badgeDisplay.textContent = "Level 1: Beginner";
        badgeDisplay.style.background = "var(--secondary)";
      } else {
        btnInter.classList.add('active');
        btnBasic.classList.remove('active');
        badgeDisplay.textContent = "Level 2: Intermediate";
        badgeDisplay.style.background = "var(--primary-dark)";
      }

      resultArea.classList.add('hidden');
      boxGrid.innerHTML = '';
      for (let i = 0; i < GRID_SIZE; i++) {
        const box = document.createElement('div');
        box.className = 'number-box';
        box.textContent = i + 1;
        box.addEventListener('click', () => startTestForStudent(box));
        boxGrid.appendChild(box);
      }
    }

    function startTestForStudent(box) {
      if (box.classList.contains('picked')) return;
      box.classList.add('picked');

      generatePhase1Data();
      generatePhase2Data();
      generatePhase3Data();

      currentPhase = 1;
      updateUIForPhase();
      resultArea.classList.remove('hidden');
      resultArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function generatePhase1Data() {
      const shuffled = [...vocabDB].sort(() => 0.5 - Math.random());
      const selectedQuestions = shuffled.slice(0, 4);
      const distractors = shuffled.slice(4, 6).map(q => q.word);
      
      const wordOptions = [...selectedQuestions.map(q => q.word), ...distractors].sort(() => 0.5 - Math.random());
      
      currentVocabTest = { questions: selectedQuestions, options: wordOptions };
    }

    function generatePhase2Data() {
      const texts = readingDB[currentLevel];
      currentReadingText = texts[Math.floor(Math.random() * texts.length)];
    }

    function generatePhase3Data() {
      const categories = speakingDB[currentLevel];
      const randomCategory = categories[Math.floor(Math.random() * categories.length)];
      const randomScenario = randomCategory.scenarios[Math.floor(Math.random() * randomCategory.scenarios.length)];
      
      currentSpeakingTask = { categoryName: randomCategory.name, ...randomScenario };
    }

    function updateUIForPhase() {
      phase1Content.classList.add('hidden');
      phase2Content.classList.add('hidden');
      phase3Content.classList.add('hidden');
      
      phaseIndicator.textContent = `${currentPhase} / 3`;

      if (currentPhase === 1) {
        phaseTitle.textContent = "Phase 1: Vocabulary";
        phase1Content.classList.remove('hidden');
        renderPhase1();
        nextPhaseBtn.textContent = "NEXT PHASE (READING)";
        nextPhaseBtn.style.display = "block";
      } 
      else if (currentPhase === 2) {
        phaseTitle.textContent = "Phase 2: Reading";
        phase2Content.classList.remove('hidden');
        document.getElementById('reading-passage').textContent = currentReadingText;
        nextPhaseBtn.textContent = "NEXT PHASE (SPEAKING)";
      } 
      else if (currentPhase === 3) {
        phaseTitle.textContent = "Phase 3: Speaking";
        phase3Content.classList.remove('hidden');
        renderPhase3();
        nextPhaseBtn.style.display = "none"; 
      }
    }

    function renderPhase1() {
      const bank = document.getElementById('word-bank');
      const list = document.getElementById('sentence-list');
      bank.innerHTML = '';
      list.innerHTML = '';
      draggedItem = null;

      currentVocabTest.options.forEach(word => {
        const span = document.createElement('span');
        span.className = 'word-badge';
        span.textContent = word;
        span.draggable = true;
        
        span.addEventListener('dragstart', function(e) {
          draggedItem = this;
          setTimeout(() => this.classList.add('dragging'), 0);
        });
        
        span.addEventListener('dragend', function() {
          this.classList.remove('dragging');
          draggedItem = null;
        });
        
        bank.appendChild(span);
      });

      bank.addEventListener('dragover', e => e.preventDefault());
      bank.addEventListener('drop', function(e) {
        if (draggedItem) {
          this.appendChild(draggedItem);
        }
      });

      currentVocabTest.questions.forEach((q, index) => {
        const div = document.createElement('div');
        div.className = 'sentence-item';
        
        div.innerHTML = `<strong>${index + 1}.</strong> ${q.sentence.replace('_____', `<span class="drop-zone" data-answer="${q.word}"></span>`)}`;
        
        const dropZone = div.querySelector('.drop-zone');
        
        dropZone.addEventListener('dragover', e => {
          e.preventDefault();
        });
        
        dropZone.addEventListener('dragenter', function(e) {
          e.preventDefault();
          this.classList.add('over');
        });
        
        dropZone.addEventListener('dragleave', function() {
          this.classList.remove('over');
        });
        
        dropZone.addEventListener('drop', function(e) {
          this.classList.remove('over');
          if (draggedItem) {
            if (this.firstChild) {
              bank.appendChild(this.firstChild);
            }
            this.appendChild(draggedItem);
            
            // Reset validation styles on new drop
            this.style.borderColor = '';
            this.style.backgroundColor = '';
          }
        });
        
        list.appendChild(div);
      });
    }

    function renderPhase3() {
      document.getElementById('scenario-topic').textContent = `Topic: ${currentSpeakingTask.categoryName}`;
      document.getElementById('scenario-situation').textContent = currentSpeakingTask.situation;
      document.getElementById('answer-box').textContent = currentSpeakingTask.answer;
      
      document.getElementById('answer-box').classList.add('hidden');
      document.getElementById('answer-btn').textContent = "SHOW SAMPLE ANSWER";

      const formulaContainer = document.getElementById('formula-container');
      const guidelinesContainer = document.getElementById('guidelines-container');

      if (currentLevel === 'basic') {
        guidelinesContainer.classList.add('hidden');
        formulaContainer.classList.remove('hidden');
        document.getElementById('formula-text').innerHTML = currentSpeakingTask.template; 
      } else {
        formulaContainer.classList.add('hidden');
        guidelinesContainer.classList.remove('hidden');
        const list = document.getElementById('guidelines-list');
        list.innerHTML = '';
        currentSpeakingTask.guidelines.forEach(g => {
          const li = document.createElement('li');
          li.textContent = g;
          list.appendChild(li);
        });
      }
    }

    function handleNextPhase() {
      if (currentPhase === 1) {
        let allCorrect = true;
        const dropZones = document.querySelectorAll('.drop-zone');
        
        dropZones.forEach(zone => {
          const correctAnswer = zone.getAttribute('data-answer');
          const droppedBadge = zone.querySelector('.word-badge');
          
          if (!droppedBadge || droppedBadge.textContent !== correctAnswer) {
            allCorrect = false;
            zone.style.borderColor = 'var(--secondary-dark)';
            zone.style.backgroundColor = 'rgba(229, 80, 57, 0.1)';
          } else {
            zone.style.borderColor = 'var(--accent)';
            zone.style.backgroundColor = 'rgba(120, 224, 143, 0.2)';
          }
        });

        if (!allCorrect) {
          alert("Please match all the correct words before moving to the reading phase!");
          return; 
        }
      }

      if (currentPhase < 3) {
        currentPhase++;
        updateUIForPhase();
      }
    }

    function toggleAnswer() {
      const box = document.getElementById('answer-box');
      const btn = document.getElementById('answer-btn');
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        btn.textContent = "HIDE SAMPLE ANSWER";
      } else {
        box.classList.add('hidden');
        btn.textContent = "SHOW SAMPLE ANSWER";
      }
    }

    function handleSpinAgain() {
      generatePhase3Data();
      renderPhase3();
    }

    init();
  </script>
</body>
</html>
